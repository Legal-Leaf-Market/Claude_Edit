<div class="body-area centre"><div class="kicker">Why it is uneven</div><p class="body">A lamp has thermal lag. It does not brighten and dim the instant the drive signal says to.</p><p class="body dim">So it is neither a symmetrical phaser nor an even tremolo, and you hear a throb heavier on one side of its cycle than the other.</p></div>
