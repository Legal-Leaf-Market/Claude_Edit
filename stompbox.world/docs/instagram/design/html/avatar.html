<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>avatar</title><style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1080px; height: 1080px; overflow: hidden; background: #070c1c; }
  .a {
    width: 1080px; height: 1080px;
    display: flex; align-items: center; justify-content: center;
    background-color: #070c1c;
    background-image:
      radial-gradient(75% 60% at 50% 32%, rgba(255,194,51,0.075), transparent 62%),
      repeating-linear-gradient(45deg, rgba(255,255,255,0.02) 0 1px, transparent 1px 4px),
      repeating-linear-gradient(-45deg, rgba(0,0,0,0.06) 0 1px, transparent 1px 4px);
  }
</style></head>
<body><div class="a">
  <svg viewBox="0 0 100 100" width="620" height="620" role="img" aria-label="stompbox.world">
    <rect x="19" y="3" width="62" height="94" rx="10" fill="#183573" stroke="#ffffff" stroke-width="4"/>
    <rect x="24.5" y="8.5" width="51" height="83" rx="6.5" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="1.4"/>
    <circle cx="50" cy="15.5" r="3.3" fill="#24e07a"/>
    <circle cx="34" cy="36" r="6.4" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.6"/>
    <circle cx="66" cy="36" r="6.4" fill="none" stroke="#ffffff" stroke-opacity="0.4" stroke-width="1.6"/>
    <circle cx="50" cy="68" r="14" fill="#070f24" stroke="#ffffff" stroke-width="3.4"/>
    <circle cx="50" cy="68" r="8.6" fill="none" stroke="#ffffff" stroke-opacity="0.34" stroke-width="1.4"/>
  </svg>
</div></body></html>
