<div class="body-area centre"><div class="kicker">And why chords fall apart</div><p class="body">A clear bell-like octave on a single note high on the neck, and clangorous noise on a chord.</p><p class="body dim">The rectifier has no way to separate two notes, so it folds the whole mess at once. The chaos is not a fault, it is what the pedal is for.</p></div>
